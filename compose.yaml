services:
  workspace-db:
    image: postgres:17
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: workspace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - workspace-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d workspace" ]
      interval: 5s
      retries: 10

  workspace-migrator:
    image: bizcord-workspace-api
    build:
      context: .
      dockerfile: src/Bizcord.WorkspaceApi/Dockerfile
    command: [ "migrate" ]
    environment:
      ConnectionStrings__Database: "Host=workspace-db;Port=5432;Database=workspace;Username=postgres;Password=postgres"
    depends_on:
      workspace-db:
        condition: service_healthy

  workspace-api:
    image: bizcord-workspace-api
    build:
      context: .
      dockerfile: src/Bizcord.WorkspaceApi/Dockerfile
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=workspace-db;Port=5432;Database=workspace;Username=postgres;Password=postgres"
      ConnectionStrings__Messaging: "host=rabbitmq;username=kalo;password=kalo"
    depends_on:
      rabbitmq:
        condition: service_healthy
      workspace-migrator:
        condition: service_completed_successfully

  rabbitmq:
    image: rabbitmq:4-management
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: kalo
      RABBITMQ_DEFAULT_PASS: kalo
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmq-diagnostics ping" ]
      interval: 5s
      retries: 10

volumes:
  workspace-db-data:
  rabbitmq-lib:
  rabbitmq-log:
