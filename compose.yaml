# Every Bizcord service logs to stdout with the json-file driver. The tag puts the container name in each log line,
# so the Fluentd sidecar can tell the services apart (docs/logging.md).
x-service-logging: &service-logging
  driver: json-file
  options:
    tag: "{{.Name}}"

services:
  workspace-db:
    image: postgres:17
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: workspace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - workspace-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d workspace" ]
      interval: 5s
      retries: 10

  workspace-migrator:
    image: bizcord-workspace-api
    logging: *service-logging
    build:
      context: .
      dockerfile: src/Bizcord.WorkspaceApi/Dockerfile
    command: [ "migrate" ]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${WORKSPACE_API_VAULT_TOKEN}
    depends_on:
      workspace-db:
        condition: service_healthy
      vault:
        condition: service_healthy

  workspace-api:
    image: bizcord-workspace-api
    logging: *service-logging
    build:
      context: .
      dockerfile: src/Bizcord.WorkspaceApi/Dockerfile
    # No port: only the gateway is reachable from outside the compose network (#72)
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${WORKSPACE_API_VAULT_TOKEN}
    depends_on:
      rabbitmq:
        condition: service_healthy
      workspace-migrator:
        condition: service_completed_successfully
      vault:
        condition: service_healthy

  file-db:
    image: postgres:17
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: file
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - file-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d file" ]
      interval: 5s
      retries: 10

  file-migrator:
    image: bizcord-file-api
    logging: *service-logging
    build:
      context: .
      dockerfile: src/Bizcord.FileApi/Dockerfile
    command: [ "migrate" ]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${FILE_API_VAULT_TOKEN}
    depends_on:
      file-db:
        condition: service_healthy
      vault:
        condition: service_healthy

  file-api:
    image: bizcord-file-api
    logging: *service-logging
    build:
      context: .
      dockerfile: src/Bizcord.FileApi/Dockerfile
    # No port: only the gateway is reachable from outside the compose network (#72)
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${FILE_API_VAULT_TOKEN}
    depends_on:
      rabbitmq:
        condition: service_healthy
      file-migrator:
        condition: service_completed_successfully
      vault:
        condition: service_healthy

  gateway:
    image: bizcord-gateway
    logging: *service-logging
    build:
      context: .
      dockerfile: src/Bizcord.Gateway/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${GATEWAY_VAULT_TOKEN}
    depends_on:
      - workspace-api
      - file-api
      - vault

  # Stand-in for the Message service in the upload saga (docs/upload-saga.md).
  # MessageStub__Behavior can be Succeed, Fail or NoReply to try each path.
  message-stub:
    image: bizcord-message-stub
    logging: *service-logging
    build:
      context: .
      dockerfile: src/Bizcord.MessageStub/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${MESSAGE_STUB_VAULT_TOKEN}
      MessageStub__Behavior: ${MESSAGE_STUB_BEHAVIOR:-Succeed}
    depends_on:
      rabbitmq:
        condition: service_healthy
      vault:
        condition: service_healthy

  # Logging sidecar (#83). Runs as root, because Docker's log files are only readable by root.
  fluentd:
    image: fluent/fluentd:v1.18-1
    user: root
    volumes:
      - ./fluentd/fluent.conf:/fluentd/etc/fluent.conf:ro
      - /var/lib/docker/containers:/fluentd/log/containers:ro
    environment:
      FLUENTD_CONF: fluent.conf

  rabbitmq:
    image: rabbitmq:4-management
    # The healthcheck runs as this user too. As root it could create the Erlang cookie before the server did,
    # owned by root, and RabbitMQ crashed on its first start because it couldn't read it (#110).
    user: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: kalo
      RABBITMQ_DEFAULT_PASS: kalo
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmq-diagnostics ping" ]
      interval: 5s
      retries: 10
  
  vault:
    image: hashicorp/vault:1.21.0
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - ./vault/config.hcl:/vault/config/config.hcl:ro
      - vault-data:/vault/file
    command: server
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    healthcheck:
      test: [ "CMD", "vault", "status" ]
      interval: 5s
      retries: 10

volumes:
  workspace-db-data:
  file-db-data:
  rabbitmq-lib:
  rabbitmq-log:
  vault-data:
