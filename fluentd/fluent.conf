# Sidecar that collects the stdout of the Bizcord containers (docs/logging.md).
# The services only write to stdout. Docker stores that as JSON files, and Fluentd tails those files,
# so no service knows where its logs end up.
<source>
  @type tail
  path /fluentd/log/containers/*/*-json.log
  pos_file /fluentd/log/containers.pos
  tag docker.*
  read_from_head true
  <parse>
    @type json
    time_key time
    time_type string
  </parse>
</source>

# Only containers that use the service-logging settings in compose.yaml get attrs.tag (the container name).
# Every other container is dropped, including Fluentd itself, which would otherwise read its own output forever.
<filter docker.**>
  @type grep
  <regexp>
    key $.attrs.tag
    pattern /.+/
  </regexp>
</filter>

# Puts the container name first and drops the Docker fields nobody needs
<filter docker.**>
  @type record_transformer
  enable_ruby true
  renew_record true
  <record>
    container ${record.dig("attrs", "tag")}
    stream ${record["stream"]}
    log ${record["log"].to_s.chomp}
  </record>
</filter>

# Stands in for a central log system: everything is printed on Fluentd's own stdout
<match docker.**>
  @type stdout
</match>
